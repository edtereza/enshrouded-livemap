name: Build and release

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Read version
        id: version
        shell: pwsh
        run: |
          $match = [regex]::Match((Get-Content CMakeLists.txt -Raw), 'project\(enshrouded_livemap VERSION (\d+\.\d+\.\d+)')
          if (-not $match.Success) { throw 'Project version missing' }
          $version = $match.Groups[1].Value
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw 'Release tag must match the project version'
          }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Build, test and package
        shell: cmd
        run: call package.cmd
      - uses: actions/upload-artifact@v7
        with:
          name: EnshroudedLiveMap-${{ steps.version.outputs.version }}
          path: dist/EnshroudedLiveMap-*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: EnshroudedLiveMap-${{ needs.build.outputs.version }}
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/*.zip --verify-tag --generate-notes --title "Enshrouded Live Map $RELEASE_TAG"
