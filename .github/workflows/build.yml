name: Build and release

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Read version
        id: version
        shell: pwsh
        run: |
          $match = [regex]::Match((Get-Content CMakeLists.txt -Raw), 'project\(enshrouded_livemap VERSION (\d+\.\d+\.\d+)')
          if (-not $match.Success) { throw 'Project version missing' }
          $version = $match.Groups[1].Value
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw 'Release tag must match the project version'
          }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Build, test and package
        shell: cmd
        run: call package.cmd
      - uses: actions/upload-artifact@v7
        with:
          name: livemap-${{ steps.version.outputs.version }}
          path: dist/distribution/*
          retention-days: 90
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ needs.build.outputs.version }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: livemap-${{ needs.build.outputs.version }}
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: v${{ needs.build.outputs.version }}
          RELEASE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if tagged_sha=$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq '.sha' 2>/dev/null); then
            if [ "$tagged_sha" != "$RELEASE_SHA" ]; then
              echo "::error::Increment the version in CMakeLists.txt, README.md and package/README.txt before committing: $RELEASE_TAG already belongs to another commit."
              exit 1
            fi
          fi
          if gh release view "$RELEASE_TAG" --json isDraft > release.json 2>/dev/null; then
            if [ "$(jq -r '.isDraft' release.json)" = false ]; then
              echo "$RELEASE_TAG is already published for this commit."
              exit 0
            fi
            gh release upload "$RELEASE_TAG" dist/*.zip --clobber
          else
            gh release create "$RELEASE_TAG" dist/*.zip --target "$RELEASE_SHA" --draft --generate-notes --title "$RELEASE_TAG"
          fi
          gh release edit "$RELEASE_TAG" --draft=false --title "$RELEASE_TAG"
